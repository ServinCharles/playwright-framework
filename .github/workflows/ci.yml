name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks, unit, API and AI evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test:unit
      - run: npm run test:api
      - run: npm run test:ai-eval
      - name: AI evaluation quality gate
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-report
          path: reports/eval/
          if-no-files-found: ignore

  redteam:
    name: Red team (scripted model, gate and has-teeth check)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the scripted chat API (safe)
        run: |
          PORT=3101 CHAT_API_MODE=safe npx tsx mock-chat-api/server.ts > safe.log 2>&1 &
          for i in $(seq 1 20); do curl -fs localhost:3101/health && break; sleep 1; done
      - name: 'Gate: every attack must fail to get through'
        env:
          CHAT_API_URL: http://localhost:3101
        run: npm run redteam
      - name: HTML report
        if: always()
        env:
          CHAT_API_URL: http://localhost:3101
        run: npm run redteam:html
      - name: 'Has teeth: the buggy API must fail the gate'
        run: |
          PORT=3102 CHAT_API_MODE=buggy npx tsx mock-chat-api/server.ts > buggy.log 2>&1 &
          for i in $(seq 1 20); do curl -fs localhost:3102/health && break; sleep 1; done
          if CHAT_API_URL=http://localhost:3102 npm run redteam; then
            echo "::error::The buggy chat API passed the red team gate. The assertions are not catching leaks."
            exit 1
          fi
          echo "Buggy API failed the gate, as expected."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-report
          path: reports/redteam/
          if-no-files-found: ignore

  ui:
    name: UI smoke tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=ui-chromium --grep @smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/junit/
          if-no-files-found: ignore

  infra:
    name: Terraform and Docker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format and validate (no AWS account needed)
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Build the container image (not pushed)
        run: docker build -t chat-service:ci .
      - name: Container starts and answers /health
        run: |
          docker run -d --name svc -p 3101:3101 -e ALLOW_FAKE_MODEL=1 chat-service:ci
          for i in $(seq 1 20); do curl -fs localhost:3101/health && exit 0; sleep 1; done
          docker logs svc
          exit 1
