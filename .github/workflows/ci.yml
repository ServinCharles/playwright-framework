name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks, unit, API and AI evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: npm run test:api
      - run: npm run test:ai-eval
      - name: AI evaluation quality gate
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-report
          path: reports/eval/
          if-no-files-found: ignore

  ui:
    name: UI smoke tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=ui-chromium --grep @smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/junit/
          if-no-files-found: ignore

  infra:
    name: Terraform and Docker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform format and validate (no AWS account needed)
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Build the container image (not pushed)
        run: docker build -t chat-service:ci .
      - name: Container starts and answers /health
        run: |
          docker run -d --name svc -p 3101:3101 -e ALLOW_FAKE_MODEL=1 chat-service:ci
          for i in $(seq 1 20); do curl -fs localhost:3101/health && exit 0; sleep 1; done
          docker logs svc
          exit 1
