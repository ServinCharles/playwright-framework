name: Secret guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Block committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked. Keep real values in a local .env only."
            exit 1
          fi

      - name: Block known key formats
        run: |
          pats='sk-ant-[A-Za-z0-9_-]{20,}|\bpa-[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          if git grep -nE "$pats" -- . ':!.github/workflows/secret-guard.yml'; then
            echo "::error::Possible secret found in the files above. Remove it and rotate the key."
            exit 1
          fi
